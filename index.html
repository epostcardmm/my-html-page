<html lang="my"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>Number 1 Photo Collage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Times New Roman', Times, serif;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 40px;
        }

        /* ဓာတ်ပုံများ "1" ပုံစံ စီမည့် Grid Layout */
        .number-one-grid {
            display: grid;
            grid-template-columns: repeat(7, 45px); /* ကော်လံ ၇ ခု */
            grid-auto-rows: 45px;                   /* အတန်း အမြင့် */
            gap: 3px;                               /* ပုံကြား အကွာအဝေး */
        }

        .grid-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px;
        }

        /* ဘေးဘက်မှ စာတမ်း Style */
        .text-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .text-year {
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 12px;
            text-align: center;
            line-height: 1.2;
            color: #111;
        }

        .text-with-you {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 36px;
            margin-top: 10px;
            color: #444;
        }
    </style>
</head>
